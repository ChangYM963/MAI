[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mai-research"
version = "0.2.0"
description = "Majority-alignment drift and reliability evaluation for multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.45,<5"]

[project.scripts]
mai = "mai.__main__:main"

[tool.setuptools.packages.find]
include = ["mai*", "demo*"]
