name: Reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: python -m mai pipeline --config configs/demo.json --output runs/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report-py${{ matrix.python-version }}
          path: |
            runs/ci-demo/report.html
            runs/ci-demo/summary.json
            runs/ci-demo/contextual.csv
            runs/ci-demo/reliability.csv
